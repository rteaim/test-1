<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAPO CAMPUS PLAYGROUND</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:#eef4ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}#view{position:fixed;inset:0}canvas{display:block}
header{position:fixed;z-index:2;top:12px;left:12px;padding:10px 14px;border:1px solid #465875;border-radius:14px;background:#101a2be8;backdrop-filter:blur(10px)}header small{color:#83dfbd;letter-spacing:.1em;font-weight:800}header strong{display:block;font-size:17px}
.panel{position:fixed;z-index:2;right:12px;top:12px;width:230px;padding:12px;border:1px solid #465875;border-radius:15px;background:#101a2be8;backdrop-filter:blur(10px);max-height:calc(100dvh - 24px);overflow:auto}.panel h3{font-size:12px;color:#9fb1cb;margin:4px 2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{border:1px solid #455a78;border-radius:9px;background:#263852;color:#f0f5ff;padding:9px 6px;font:600 12px inherit;cursor:pointer}button:active{transform:scale(.98)}button.active{background:#17634f;border-color:#69c9a8}.wide{grid-column:1/-1}.selected{font-size:12px;color:#c6d5e9;padding:5px 3px 9px;min-height:30px}
#toast{position:fixed;z-index:5;top:78px;left:50%;transform:translateX(-50%);background:#172943;border:1px solid #607999;padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
footer{position:fixed;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);background:#101a2bdc;border:1px solid #40536f;border-radius:20px;padding:8px 14px;font-size:11px;color:#bdcbe0;white-space:nowrap}
@media(max-width:650px){header{top:8px;left:8px;padding:8px 10px}header strong{font-size:13px}.panel{top:auto;bottom:42px;right:8px;width:178px;padding:8px;max-height:54dvh}.panel h3{margin:3px 2px 6px}.grid{gap:5px}button{padding:8px 4px;font-size:11px}footer{bottom:8px;left:8px;transform:none;font-size:9px}}
</style></head>
<body>
<div id="view"></div>
<header><small>UNOFFICIAL 3D SANDBOX</small><strong>MAPO CAMPUS PLAYGROUND</strong></header>
<section class="panel">
<h3>파괴 도구</h3><div class="grid">
<button data-tool="select" class="active">선택</button><button data-tool="impact">충격파</button>
<button data-tool="blast">폭발</button><button data-tool="quake">지진</button>
<button data-tool="gravity">중력장</button><button data-tool="reset">전체 복구</button>
</div>
<h3>선택한 오브젝트</h3><div id="selected" class="selected">건물 또는 시설을 선택하세요</div>
<div class="grid"><button id="undo" class="wide">↶ 실행 취소</button><button id="labels" class="wide">건물 이름 표시/숨김</button></div>
</section>
<div id="toast"></div><footer>드래그: 시점 회전 · 휠/핀치: 확대 · 도구 선택 후 건물 터치</footer>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111c30);scene.fog=new THREE.Fog(0x111c30,85,180);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,300);camera.position.set(55,65,72);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=1.48;controls.minDistance=20;controls.maxDistance=140;
scene.add(new THREE.HemisphereLight(0xb8d0f0,0x263044,2));const sun=new THREE.DirectionalLight(0xe6efff,2.4);sun.position.set(-40,75,35);sun.castShadow=true;scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,105),M(0x25334a));ground.rotation.x=-Math.PI/2;ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
const buildings=[],labels=[],debris=[],history=[];let tool='select',selected=null,showLabels=true;
function box(x,y,z,w,h,d,color,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(color));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function label(t,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=100;const q=c.getContext('2d');q.fillStyle='#14243bdc';q.beginPath();q.roundRect(4,5,504,90,18);q.fill();q.font='bold 43px sans-serif';q.textAlign='center';q.fillStyle='#eaf2ff';q.fillText(t,256,65);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.position.set(x,y,z);s.scale.set(13,2.5,1);scene.add(s);labels.push(s)}
function field(t,x,z,w,d){box(x,.04,z,w,.12,d,0x07533f);label(t,x,.5,z)}
function building(name,x,z,w,d,h,color=0x3b4d68,rot=0){const g=new THREE.Group();const b=box(0,h/2,0,w,h,d,color,g);box(0,h+.13,0,w*.92,.26,d*.92,0x53637c,g);box(0,h*.48,0,w+.04,.18,d+.04,0x50617b,g);g.position.set(x,0,z);g.rotation.y=rot;g.userData={name,x,z,w,d,h,color,broken:false};scene.add(g);buildings.push(g);label(name,x,h+3,z);return g}
function slab(x,z,w,d,c=0x53627a){box(x,-.12,z,w,.15,d,c)}
slab(0,-44,105,2);slab(0,44,105,2);slab(-52,0,2,88);slab(52,0,2,88);
field('축구장 · 육상 트랙',-32,-17,25,34);field('테니스장',-43,12,8,12);field('농구장',-25,12,9,12);field('보조 운동장',-42,-1,7,7);field('보조 운동장',-24,5,8,5);
slab(0,0,37,28,0x303f55);field('중앙 운동 공간',1,-3,8,5);
building('마포고 본관',-2,-17,25,5,5.4,0x3e506b,-.04);
building('은곡관',-22,-29,11,8,4.6);
building('체육관',-4,15,13,9,5.5);
building('인의관',17,15,12,10,5.7);
building('마포고 별관',-16,-4,8,7,4.1);
building('유석초 본관',25,-23,16,8,5,0x3c4d68,.03);
building('유석초 부속동',30,-10,8,6,3.6);
building('유석초 체육시설',25,1,10,7,4);
field('AAFC 유석초구장',24,7,11,15);field('보조 운동장',39,8,5,10);
for(let i=0;i<8;i++)slab(-12+i*3,30,1.1,5,0x68788e);
label('마포고등학교 × 유석초등학교',0,16,0);
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let pointerDown=null;
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1450)}
function selectAt(e){ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(ptr,camera);let hits=ray.intersectObjects(buildings,true);if(!hits.length){selected=null;document.querySelector('#selected').textContent='선택된 건물 없음';return}let o=hits[0].object;while(o.parent&&!o.userData.name)o=o.parent;selected=o;document.querySelector('#selected').textContent=o.userData.name}
renderer.domElement.addEventListener('pointerdown',e=>pointerDown={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(!pointerDown||Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y)>8)return;selectAt(e);if(!selected)return;if(tool==='select'){toast(selected.userData.name+' 선택');return}if(tool==='reset'){restore();return}if(tool==='impact'||tool==='blast'||tool==='quake'||tool==='gravity')destroy(selected,tool)});
function snapshot(){history.push(buildings.map(b=>({scale:b.scale.clone(),pos:b.position.clone(),visible:b.visible,broken:b.userData.broken})));if(history.length>12)history.shift()}
function destroy(g,kind){if(g.userData.broken)return toast('이미 변형된 오브젝트입니다');snapshot();g.userData.broken=true;const {w,d,h}=g.userData;const count=kind==='blast'?30:kind==='quake'?22:kind==='gravity'?18:14;g.visible=false;
const origin=g.position.clone();const geom=new THREE.BoxGeometry(w/3,h/3,d/3);
for(let i=0;i<count;i++){const m=new THREE.Mesh(geom,M([0x526783,0x435773,0x687b95][i%3]));m.position.set(origin.x+(Math.random()-.5)*w,Math.random()*h,origin.z+(Math.random()-.5)*d);m.rotation.set(Math.random(),Math.random(),Math.random());m.castShadow=true;scene.add(m);
let v=new THREE.Vector3((Math.random()-.5)*.12,(Math.random()*.18+.04),(Math.random()-.5)*.12);
if(kind==='gravity')v.multiplyScalar(-1.5);if(kind==='quake')v.y*=.3;if(kind==='blast')v.multiplyScalar(1.8);
debris.push({mesh:m,v,life:kind==='gravity'?240:300,gravity:kind==='gravity'?.0018:.0035});}
const ring=new THREE.Mesh(new THREE.RingGeometry(.4,1.0,48),new THREE.MeshBasicMaterial({color:kind==='blast'?0xff9b59:0x69d8ff,transparent:true,opacity:.9,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(origin.x,.2,origin.z);scene.add(ring);let s=1;const expand=()=>{s+=.13;ring.scale.setScalar(s);ring.material.opacity=Math.max(0,1-s/15);if(s<15)requestAnimationFrame(expand);else{scene.remove(ring);ring.geometry.dispose();ring.material.dispose()}};expand();
toast(({impact:'충격파',blast:'가상 폭발',quake:'지진',gravity:'중력장'})[kind]+' 효과 실행')}
function restore(){buildings.forEach(b=>{b.visible=true;b.scale.set(1,1,1);b.position.set(0,0,0);b.userData.broken=false});debris.forEach(d=>scene.remove(d.mesh));debris.length=0;history.length=0;toast('캠퍼스 전체 복구 완료')}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));if(tool==='reset')restore();else toast('도구: '+b.textContent+' · 건물을 선택하세요')});
document.querySelector('#undo').onclick=()=>{const s=history.pop();if(!s)return toast('되돌릴 작업이 없습니다');buildings.forEach((b,i)=>{b.scale.copy(s[i].scale);b.position.copy(s[i].pos);b.visible=s[i].visible;b.userData.broken=s[i].broken});debris.forEach(d=>scene.remove(d.mesh));debris.length=0;toast('직전 상태로 되돌렸습니다')};
document.querySelector('#labels').onclick=()=>{showLabels=!showLabels;labels.forEach(l=>l.visible=showLabels)};
function animate(){requestAnimationFrame(animate);for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.v.y-=d.gravity;d.mesh.position.add(d.v);d.mesh.rotation.x+=.018;d.mesh.rotation.y+=.013;d.life--;if(d.mesh.position.y<.15){d.mesh.position.y=.15;d.v.y*=-.22;d.v.x*=.78;d.v.z*=.78}if(d.life<=0){scene.remove(d.mesh);debris.splice(i,1)}}controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
